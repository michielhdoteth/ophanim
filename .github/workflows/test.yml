name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[test]"

      - name: Verify ffmpeg
        run: ffmpeg -version

      - name: Run tests
        run: |
          pytest tests/ -m "not slow" -v --timeout=30

      - name: Check imports
        run: |
          python -c "from openvision import process, transcribe"
          python -c "from openvision.providers import get_provider, list_providers"
          python -c "from openvision.core.stream import JsonlWriter"
          python -c "from openvision.core.memory import VideoMemory"
          python -c "from openvision.storage.cache import RunCache"
