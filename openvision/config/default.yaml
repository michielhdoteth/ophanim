machine:
  gpu: "RTX 4050 Laptop"
  vram_gb: 6
  safe_mode: true

defaults:
  mode: "balanced"
  max_resolution: 768
  fps: 0.5
  max_frames: 60
  segmentation_fps: 0.25
  tracking_fps: 0.5
  max_video_length_minutes: 20
  max_concurrent_jobs: 1

models:
  vlm:
    # Provider selection: "auto" | "lmstudio" | "ollama" | "llamacpp" | "openai" | "groq" | "together" | "vllm"
    provider: "auto"
    model: "auto"     # Auto-detect or explicit name (e.g. "llava:13b", "gpt-4o")

    # Provider-specific settings (optional, with sensible defaults)
    lmstudio:
      base_url: "http://localhost:1234/v1"

    ollama:
      base_url: "http://localhost:11434"
      keep_alive: "5m"

    llamacpp:
      base_url: "http://localhost:8080/v1"

    openai:
      base_url: null   # Use official API (https://api.openai.com/v1)
      api_key: null    # Or set OPENAI_API_KEY env var

    # Shared VLM settings
    max_loaded: 1
    temperature: 0.1
    max_tokens: 1024

  segmentation:
    provider: "sam"
    model: "sam-2.1"
    fallback_model: "mobile-sam"
    load_on_demand: true

  ocr:
    enabled: false
    provider: "paddleocr"

gpu_policy:
  unload_after_job: true
  min_free_vram_gb: 1.5
  fallback_resolution: 512
  allow_parallel_gpu_models: false

# Data dirs default to ~/.openvision/{memory,downloads,runs}
# Override with OPENVISION_HOME env, or absolute paths below.
paths:
  # home: "~/.openvision"
  # memory: "memory"      # relative to home, or absolute
  # downloads: "downloads"
  # runs: "runs"

cache:
  enabled: true
  # Relative paths resolve under OPENVISION_HOME when paths.runs is used by callers;
  # RunCache still accepts this value (prefer absolute or leave default).
  directory: "runs"
  reuse_existing: true

modes:
  fast:
    resolution: 512
    fps: 0.25
    max_frames: 30
    segmentation: false
    ocr: false

  balanced:
    resolution: 768
    fps: 0.5
    max_frames: 60
    segmentation: "on_demand"
    ocr: false

  detailed:
    resolution: 1024
    fps: 1.0
    max_frames: 180
    segmentation: true
    ocr: true
