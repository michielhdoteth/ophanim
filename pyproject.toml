[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "openvision"
version = "1.0.0"
description = "Self-hosted, privacy-first AI vision tool for CLI and agents"
requires-python = ">=3.12"
dependencies = [
    "opencv-python>=4.13",
    "pillow>=11",
    "numpy>=2",
    "typer>=0.23",
    "rich>=13",
    "pydantic>=2",
    "httpx>=0.28",
    "pyyaml>=6",
    "nvidia-ml-py>=12",
    "imageio>=2.36",
    "scikit-learn>=1.6",
    "scipy>=1.13",
    "tqdm>=4.67",
    "click>=8",
    "yt-dlp>=2025",
]

[project.scripts]
openvision = "cli.app:app"
ov = "cli.app:app"

[tool.setuptools]
py-modules = ["models"]

[tool.setuptools.packages.find]
include = ["cli*", "core*", "providers*", "storage*"]
